name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # 3.8 is the documented floor; ubuntu-latest no longer ships it
          - os: ubuntu-22.04
            python-version: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal runtime deps (CLI footprint)
        run: python -m pip install -r requirements-light.txt

      - name: Compile all entry points
        run: python -m py_compile prompt_expert_enhance.py web_server.py build_app.py app_entry.py tools/privacy_scan.py tools/batch_test.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: PII / device-info scan (release gate)
        run: python tools/privacy_scan.py
